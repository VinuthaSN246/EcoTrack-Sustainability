name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json
      - run: npm ci
        working-directory: project
      - run: npm run typecheck
        working-directory: project
      - run: npm run lint
        working-directory: project
      - run: npm run test:run
        working-directory: project
      - run: npm run build
        working-directory: project

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend
    env:
      ECOTRACK_TESTING: '1'
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py database.py services/db_service.py test_flask_api.py test_database.py
      - run: python test_flask_api.py
      - run: python test_database.py
